<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Food</title>
  <script type="module" src="/src/main.js" defer></script>
</head>

<body>
  <header class="header">
    <div class="header__container container">
      <div class="header__grid">
        <img class="header__logo logo" src="/src/assets/images/logo/logo.svg" width="100" height="36" alt="Delivery Food">

        <div class="header__buttons">
          <button class="header__button button" type="button">Войти</button>
          <button class="header__button button" type="button">Корзина</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      main
    </div>
  </main>
  <footer class="footer">
    <div class="footer__container container">
      <div class="footer__grid">
        <img class="footer__logo logo" src="/src/assets/images/logo/logo.svg" width="100" height="36" alt="Delivery Food">

        <nav class="footer__nav">
          <ul class="footer__nav-list">
            <li class="footer__nav-item">
              <a class="footer__nav-link" href="#" target="_blank">
                Ресторанам
              </a>
            </li>
            <li class="footer__nav-item">
              <a class="footer__nav-link" href="#" target="_blank">
                Курьерам
              </a>
            </li>
            <li class="footer__nav-item">
              <a class="footer__nav-link" href="#" target="_blank">
                Пресс-центр
              </a>
            </li>
            <li class="footer__nav-item">
              <a class="footer__nav-link" href="#" target="_blank">
                Контакты
              </a>
            </li>
          </ul>
        </nav>

        <ul class="footer__social social">
          <li class="social__item">
            <a class="social__link" href="#" target="_blank">
              <img class="social__image" src="/src/assets/images/social/instagram.svg" width="25" height="25" alt="Instagram">
            </a>
          </li>
          <li class="social__image" class="social__item">
            <a class="social__link" href="#" target="_blank">
              <img src="/src/assets/images/social/facebook.svg" width="25" height="25" alt="Facebook"> </a>
          </li>
          <li class="social__image" class="social__item">
            <a class="social__link" href="#" target="_blank">
              <img src="/src/assets/images/social/vk.svg" width="35" height="20" alt="VK"> </a>
          </li>
        </ul>
      </div>
    </div>

  </footer>
</body>

</html>
